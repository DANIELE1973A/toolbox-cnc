<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toolbox CNC</title>
    <style>
        :root {
            --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
            --border: #2a2a2a; --text: #f0f0f0; --muted: #888;
            --t1: #4f8ef7; --t2: #3ecf8e; --mit: #f97316;
            --font-main: 'Arial Narrow', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-main); overflow-x: hidden; }

        header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 16px 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
        .logo span { font-family: var(--font-mono); font-size: 13px; display: block; font-weight: 700; letter-spacing: 3px; color: var(--muted); margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-right-btns { display: flex; flex-direction: column; gap: 5px; }
        .count-badge { font-family: var(--font-mono); font-size: 12px; padding: 5px 12px; border-radius: 100px; background: var(--surface2); color: var(--muted); }
        .sync-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 20px; font-family: var(--font-main); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .sync-btn.syncing { color: var(--t1); border-color: var(--t1); }
        .add-btn { color: var(--t2); border-color: var(--t2); }

        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-main); font-size: 18px; font-weight: 700; padding: 12px 16px 12px 44px; border-radius: 10px; outline: none; -webkit-appearance: none; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

        .tabs { display: flex; gap: 4px; }
        .tab { flex: 1; padding: 10px 4px; border: none; background: none; font-family: var(--font-main); font-size: 16px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
        .tab.active-t1 { color: var(--t1); border-bottom-color: var(--t1); }
        .tab.active-t2 { color: var(--t2); border-bottom-color: var(--t2); }
        .tab.active-mit { color: var(--mit); border-bottom-color: var(--mit); }

        main { padding: 12px 12px 80px; }
        .tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
        .expanded-t1 { border-color: var(--t1); }
        .card-header { padding: 14px; cursor: pointer; display: flex; gap: 12px; }
        .tool-num { width: 52px; height: 52px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 17px; font-weight: 900; color: var(--muted); }
        .expanded-t1 .tool-num { background: var(--t1); color: #fff; }
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-size: 17px; font-weight: 800; text-transform: uppercase; }
        .card-desc { font-size: 13px; color: var(--muted); font-style: italic; }

        .card-body { display: none; border-top: 1px solid var(--border); }
        .expanded-t1 .card-body, .expanded-t2 .card-body, .expanded-mit .card-body { display: block; }

        .detail-table { padding: 10px 14px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
        .detail-key { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 12px; }
        .detail-val { font-family: var(--font-mono); font-size: 13px; color: var(--text); text-align: right; padding: 4px 8px; border-radius: 6px; }
        input.detail-editing { background: var(--surface2); border: 1px solid var(--t1); color: #fff; text-align: right; width: 60%; padding: 4px; }

        .card-actions { display: flex; gap: 8px; padding: 12px 14px; background: var(--surface2); }
        .btn-copy { flex: 1; padding: 12px; border-radius: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; }
        .btn-primary-t1 { background: var(--t1); color: #fff; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 700; opacity: 0; transition: 0.2s; z-index: 100; }
        .toast.show { opacity: 1; }
        .toast.success { background: #22c55e; color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo">TOOLBOX CNC<span>ARCHIVIO UTENSILI</span></div>
        <div class="header-right">
            <div class="count-badge" id="count-badge">...</div>
            <div class="header-right-btns">
                <button class="sync-btn" onclick="loadFromFirebase()">Sync</button>
                <button class="sync-btn add-btn" onclick="addNewTool()">Nuovo</button>
            </div>
        </div>
    </div>
    <div class="search-wrap">
        <input type="search" id="search" placeholder="Cerca numero, nome, diametro...">
    </div>
    <div class="tabs">
        <button class="tab active-t1" data-tab="toshiba1">Toshiba 1</button>
        <button class="tab" data-tab="toshiba2">Toshiba 2</button>
        <button class="tab" data-tab="mitsubishi">Mitsubishi</button>
    </div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyD_v7ei-6lAh7f6IbZGkhmfWv5sFDhqhio",
    authDomain: "toolbox-cnc-4b720.firebaseapp.com",
    projectId: "toolbox-cnc-4b720",
    storageBucket: "toolbox-cnc-4b720.firebasestorage.app",
    messagingSenderId: "532626836671",
    appId: "1:532626836671:web:606c79a3316f9074feca0a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let DB = { toshiba1: [], toshiba2: [], mitsubishi: [] };
let activeTab = 'toshiba1';
let expandedIdx = null;
let searchQuery = '';

async function loadFromFirebase() {
    const main = document.getElementById('main');
    main.innerHTML = '<div style="text-align:center;padding:40px">Caricamento...</div>';
    try {
        for (const tab of Object.keys(DB)) {
            const docRef = doc(db, 'toolbox', tab);
            const snap = await getDoc(docRef);
            if (snap.exists()) DB[tab] = snap.data().rows || [];
        }
        render();
    } catch (e) { console.error(e); }
}

async function saveTabToFirebase(tabName) {
    try {
        await setDoc(doc(db, 'toolbox', tabName), { rows: DB[tabName] });
    } catch (e) { console.error(e); }
}

window.addNewTool = async function() {
    const existing = DB[activeTab].map(t => parseInt(t['N° Utensile']) || 0);
    const nextNum = existing.length > 0 ? Math.max(...existing) + 1 : 1;
    
    // Inserimento nuovi campi richiesti
    const newTool = {
        'N° Utensile': String(nextNum),
        'N° Correttore Raggio': String(nextNum), // Esempio: 1 se Utensile è 1
        'N° Correttore Lunghezza': String(nextNum), // Esempio: 1 se Utensile è 1
        'Nome Assembly': 'NUOVO UTENSILE',
        'Nome Utensile': '',
        'Descrizione': '',
        'Diametro (mm)': '0',
        'Giri (rpm)': '0',
        'Avanzamento (mm/min)': '0'
    };
    DB[activeTab].unshift(newTool);
    render();
    showToast('✓ Aggiunto T' + nextNum, 'success');
    await saveTabToFirebase(activeTab);
};

function render() {
    const main = document.getElementById('main');
    const tools = DB[activeTab].filter(t => 
        Object.values(t).some(v => String(v).toLowerCase().includes(searchQuery.toLowerCase()))
    );
    
    main.innerHTML = tools.map((tool, idx) => {
        const isExp = expandedIdx === idx;
        const color = activeTab === 'toshiba1' ? 't1' : activeTab === 'toshiba2' ? 't2' : 'mit';
        
        return `
            <div class="tool-card ${isExp ? 'expanded-' + color : ''}">
                <div class="card-header" onclick="toggleExpand(${idx})">
                    <div class="tool-num">${tool['N° Utensile'] || '?'}</div>
                    <div class="card-info">
                        <div class="card-name">${tool['Nome Assembly'] || 'Senza Nome'}</div>
                        <div class="card-desc">${tool['Descrizione'] || ''}</div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="detail-table">
                        ${renderRow(idx, 'N° Utensile', tool['N° Utensile'])}
                        ${renderRow(idx, 'N° Correttore Raggio', tool['N° Correttore Raggio'] || tool['N° Utensile'])}
                        ${renderRow(idx, 'N° Correttore Lunghezza', tool['N° Correttore Lunghezza'] || tool['N° Utensile'])}
                        ${renderRow(idx, 'Diametro (mm)', tool['Diametro (mm)'])}
                        ${renderRow(idx, 'Giri (rpm)', tool['Giri (rpm)'])}
                    </div>
                </div>
            </div>
        `;
    }).join('');
    document.getElementById('count-badge').textContent = tools.length + ' utensili';
}

function renderRow(idx, key, val) {
    return `
        <div class="detail-row">
            <span class="detail-key">${key}</span>
            <input class="detail-val" value="${val || '-'}" onchange="updateVal(${idx}, '${key}', this.value)">
        </div>
    `;
}

window.toggleExpand = (idx) => { expandedIdx = expandedIdx === idx ? null : idx; render(); };

window.updateVal = async (idx, key, val) => {
    DB[activeTab][idx][key] = val;
    await saveTabToFirebase(activeTab);
    showToast('✓ Salvato', 'success');
};

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('search').oninput = (e) => { searchQuery = e.target.value; render(); };

document.querySelectorAll('.tab').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active-t1', 'active-t2', 'active-mit'));
        activeTab = btn.dataset.tab;
        const color = activeTab === 'toshiba1' ? 't1' : activeTab === 'toshiba2' ? 't2' : 'mit';
        btn.classList.add('active-' + color);
        render();
    };
});

loadFromFirebase();
</script>
</body>
</html>
