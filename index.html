<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toolbox CNC</title>
    <style>
        /* Font stack senza dipendenze esterne */
        :root {
            --font-main: 'Arial Narrow', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
    </style>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #222222;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --muted: #888;
            --t1: #4f8ef7;
            --t2: #3ecf8e;
            --mit: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-main); overflow-x: hidden; }
        
        /* HEADER */
        header {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 16px 0;
        }
        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
        .logo span { font-family: var(--font-mono); font-size: 13px; display: block; font-weight: 700; letter-spacing: 3px; color: var(--muted); margin-top: 2px; }
        .count-badge {
            font-family: var(--font-mono);
            font-size: 12px; padding: 5px 12px;
            border-radius: 100px;
            background: var(--surface2);
            color: var(--muted);
        }
        
        /* SEARCH */
        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-wrap input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-family: var(--font-main);
            font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
            padding: 12px 16px 12px 44px; border-radius: 10px; outline: none;
            -webkit-appearance: none;
        }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-wrap input:focus { border-color: #444; }
        .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--muted); pointer-events: none;
        }
        
        /* TABS */
        .tabs { display: flex; gap: 4px; padding-bottom: 0; }
        .tab {
            flex: 1; padding: 10px 4px; border: none; background: none;
            font-family: var(--font-main); font-size: 16px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
            cursor: pointer; border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .tab.active-t1 { color: var(--t1); border-bottom-color: var(--t1); }
        .tab.active-t2 { color: var(--t2); border-bottom-color: var(--t2); }
        .tab.active-mit { color: var(--mit); border-bottom-color: var(--mit); }
        
        /* MAIN */
        main { padding: 12px 12px 80px; }
        
        /* TOOL CARD */
        .tool-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .tool-card.expanded-t1 { border-color: var(--t1); }
        .tool-card.expanded-t2 { border-color: var(--t2); }
        .tool-card.expanded-mit { border-color: var(--mit); }
        
        .card-header { padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; user-select: none; }
        .card-header:active { background: var(--surface2); }
        
        .tool-num {
            width: 48px; height: 48px; border-radius: 10px;
            background: var(--surface2); display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-size: 14px; font-weight: 700;
            color: var(--muted); flex-shrink: 0; transition: background 0.2s, color 0.2s;
        }
        .expanded-t1 .tool-num { background: var(--t1); color: #fff; }
        .expanded-t2 .tool-num { background: var(--t2); color: #0f0f0f; }
        .expanded-mit .tool-num { background: var(--mit); color: #fff; }
        
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .card-desc { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; font-family: var(--font-mono); }
        
        .chevron { color: var(--muted); flex-shrink: 0; margin-top: 2px; transition: transform 0.25s; }
        .tool-card.expanded-t1 .chevron,
        .tool-card.expanded-t2 .chevron,
        .tool-card.expanded-mit .chevron { transform: rotate(180deg); }
        
        .card-pills {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            border-top: 1px solid var(--border); padding: 10px 14px;
        }
        .pill { text-align: center; }
        .pill:not(:last-child) { border-right: 1px solid var(--border); }
        .pill-label { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
        .pill-val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; }
        
        /* EXPANDED */
        .card-body { display: none; border-top: 1px solid var(--border); }
        .tool-card.expanded-t1 .card-body,
        .tool-card.expanded-t2 .card-body,
        .tool-card.expanded-mit .card-body { display: block; }
        
        .detail-table { padding: 10px 14px; }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 0; border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-key { color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; font-size: 12px; }
        .detail-val { font-family: var(--font-mono); font-size: 13px; color: var(--text); text-align: right; max-width: 60%; word-break: break-word; }
        
        .card-actions { display: flex; gap: 8px; padding: 12px 14px; background: var(--surface2); }
        .btn-copy {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            font-family: var(--font-main); font-size: 16px; font-weight: 800;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: opacity 0.15s; -webkit-appearance: none;
        }
        .btn-copy:active { opacity: 0.7; }
        .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; border: none; }
        .btn-primary-t1 { background: var(--t1); color: #fff; }
        .btn-primary-t2 { background: var(--t2); color: #0f0f0f; }
        .btn-primary-mit { background: var(--mit); color: #fff; }
        
        /* EMPTY */
        .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-icon { font-size: 40px; margin-bottom: 12px; }
        .empty p { font-size: 14px; font-weight: 600; }
        
        /* TOAST */
        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #fff; color: #000; padding: 10px 20px; border-radius: 100px;
            font-family: var(--font-mono); font-size: 13px; font-weight: 700;
            opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 100;
            white-space: nowrap; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        /* NO RESULTS */
        .no-results { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    </style>
</head>
<body>

        <div class="logo">

        </div>

    <div class="search-wrap">

</header>

<main id="main"></main>

let activeTab = 'toshiba1';
let searchQuery = '';
let expandedIdx = null;

const tabColors = {
    toshiba1: 't1',
    toshiba2: 't2',
    mitsubishi: 'mit'
};

function getVal(tool, keyPart) {
    const key = Object.keys(tool).find(k => k.toLowerCase().includes(keyPart.toLowerCase()));
    const val = key ? tool[key] : undefined;
    return (val !== undefined && val !== null && String(val).trim() !== '') ? String(val) : '-';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}

function copyText(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('✓ Copiato: ' + text));
    } else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✓ Copiato: ' + text);
    }
}

function getFilteredTools() {
    const tools = DB[activeTab] || [];
    if (!searchQuery.trim()) return tools;
    const q = searchQuery.toLowerCase();
    return tools.filter(t => Object.values(t).some(v => String(v).toLowerCase().includes(q)));
}

function colorClass(suffix) {
    return 'expanded-' + tabColors[activeTab];
}

function render() {
    const tools = getFilteredTools();
    const color = tabColors[activeTab];
    const main = document.getElementById('main');
    
    document.getElementById('count-badge').textContent = tools.length + ' utensili';
    
    if (tools.length === 0) {
        main.innerHTML = '<div class="no-results">Nessun utensile trovato</div>';
        return;
    }
    
    main.innerHTML = tools.map((tool, idx) => {
        const num = getVal(tool, 'N° Utensile');
        const nome = getVal(tool, 'Nome Assembly');
        const desc = getVal(tool, 'Descrizione');
        const diam = getVal(tool, 'Diametro');
        const giri = getVal(tool, 'Giri');
        const avanz = getVal(tool, 'Avanzamento');
        const isExp = expandedIdx === idx;
        const expClass = isExp ? 'expanded-' + color : '';
        
        const detailRows = Object.entries(tool)
            .filter(([k, v]) => v && v.trim && v.trim() !== '' && v !== '-')
            .filter(([k]) => !k.toLowerCase().includes('nome assembly'))
            .map(([k, v]) => `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`)
            .join('');
        
        return `<div class="tool-card ${expClass}" data-idx="${idx}">
            <div class="card-header" onclick="toggleCard(${idx})">
                <div class="tool-num">T${num}</div>
                <div class="card-info">
                    <div class="card-name">${nome}</div>
                    <div class="card-desc">${desc}</div>
                </div>
                <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="card-pills">
                <div class="pill"><span class="pill-label">Diametro</span><span class="pill-val">Ø ${diam}</span></div>
                <div class="pill"><span class="pill-label">Giri</span><span class="pill-val">${giri}</span></div>
                <div class="pill"><span class="pill-label">Avanz.</span><span class="pill-val">${avanz}</span></div>
            </div>
            <div class="card-body">
                <div class="detail-table">${detailRows}</div>
                <div class="card-actions">
                    <button class="btn-copy btn-outline" onclick="event.stopPropagation(); copyText('${nome.replace(/'/g, "\'")}')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Nome
                    </button>
                    <button class="btn-copy btn-primary-${color}" onclick="event.stopPropagation(); copyText('${num}')">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Numero
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function toggleCard(idx) {
    expandedIdx = expandedIdx === idx ? null : idx;
    render();
    if (expandedIdx !== null) {
        setTimeout(() => {
            const cards = document.querySelectorAll('.tool-card');
            if (cards[idx]) cards[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
    }
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        expandedIdx = null;
        searchQuery = '';
        document.getElementById('search').value = '';
        
        const color = tabColors[activeTab];
        document.querySelectorAll('.tab').forEach(t => {
            t.className = 'tab';
            t.style.color = 'var(--muted)';
            t.style.borderBottomColor = 'transparent';
        });
        tab.className = 'tab active-' + color;
        tab.style.color = '';
        tab.style.borderBottomColor = '';
        
        render();
    });
});

// Search
document.getElementById('search').addEventListener('input', e => {
    searchQuery = e.target.value;
    expandedIdx = null;
    render();
});

// Init
render();
</script>
