<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toolbox CNC</title>
    <style>
        :root {
            --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
            --border: #2a2a2a; --text: #f0f0f0; --muted: #888;
            --t1: #4f8ef7; --t2: #3ecf8e; --mit: #f97316;
            --font-main: 'Arial Narrow', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-main); overflow-x: hidden; }

        header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 16px 16px 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .logo { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
        .logo span { font-family: var(--font-mono); font-size: 13px; display: block; font-weight: 700; letter-spacing: 3px; color: var(--muted); margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .header-right-btns { display: flex; flex-direction: column; gap: 5px; }
        .count-badge { font-family: var(--font-mono); font-size: 12px; padding: 5px 12px; border-radius: 100px; background: var(--surface2); color: var(--muted); }
        .sync-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 20px; font-family: var(--font-main); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .sync-btn.syncing { color: var(--t1); border-color: var(--t1); }
        .add-btn { color: var(--t2); border-color: var(--t2); }

        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--font-main); font-size: 18px; font-weight: 700; padding: 12px 16px 12px 44px; border-radius: 10px; outline: none; -webkit-appearance: none; }
        .search-wrap input::placeholder { color: var(--muted); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

        .tabs { display: flex; gap: 4px; }
        .tab { flex: 1; padding: 10px 4px; border: none; background: none; font-family: var(--font-main); font-size: 16px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
        .tab.active-t1 { color: var(--t1); border-bottom-color: var(--t1); }
        .tab.active-t2 { color: var(--t2); border-bottom-color: var(--t2); }
        .tab.active-mit { color: var(--mit); border-bottom-color: var(--mit); }

        main { padding: 12px 12px 80px; }

        .tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
        .tool-card.expanded-t1 { border-color: var(--t1); }
        .tool-card.expanded-t2 { border-color: var(--t2); }
        .tool-card.expanded-mit { border-color: var(--mit); }
        .card-header { padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; user-select: none; }
        .card-header:active { background: var(--surface2); }
        .tool-num { width: 52px; height: 52px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 17px; font-weight: 900; color: var(--muted); flex-shrink: 0; transition: background 0.2s, color 0.2s; }
        .expanded-t1 .tool-num { background: var(--t1); color: #fff; }
        .expanded-t2 .tool-num { background: var(--t2); color: #0f0f0f; }
        .expanded-mit .tool-num { background: var(--mit); color: #fff; }
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .card-desc { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; font-family: var(--font-mono); }
        .chevron { color: var(--muted); flex-shrink: 0; margin-top: 2px; transition: transform 0.25s; }
        .tool-card.expanded-t1 .chevron, .tool-card.expanded-t2 .chevron, .tool-card.expanded-mit .chevron { transform: rotate(180deg); }

        .card-pills { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); padding: 10px 14px; }
        .pill { text-align: center; }
        .pill:not(:last-child) { border-right: 1px solid var(--border); }
        .pill-label { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
        .pill-val { font-family: var(--font-mono); font-size: 14px; font-weight: 700; }

        .card-body { display: none; border-top: 1px solid var(--border); }
        .tool-card.expanded-t1 .card-body, .tool-card.expanded-t2 .card-body, .tool-card.expanded-mit .card-body { display: block; }

        .photo-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .photo-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; background: var(--surface2); display: block; margin-bottom: 8px; }
        .photo-placeholder { width: 100%; height: 90px; background: var(--surface2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; border: 1px dashed var(--border); cursor: pointer; gap: 8px; }
        .btn-photo { width: 100%; padding: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font-main); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-photo:active { opacity: 0.7; }
        #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999; align-items:center; justify-content:center; }
        #lightbox.active { display:flex; }
        #lightbox img { max-width:95vw; max-height:90vh; object-fit:contain; border-radius:8px; }
        #lightbox-close { position:fixed; top:16px; right:20px; background:none; border:none; color:#fff; font-size:36px; cursor:pointer; z-index:10000; line-height:1; }
        .btn-inserto-foto { background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:12px; cursor:pointer; padding:2px 6px; margin-left:6px; vertical-align:middle; }
        .inserto-thumb { width:32px; height:32px; object-fit:cover; border-radius:4px; vertical-align:middle; margin-left:6px; cursor:pointer; border:1px solid var(--border); }

        .edit-hint { font-size: 11px; color: var(--muted); text-align: center; padding: 6px; font-style: italic; }
        .detail-table { padding: 10px 14px; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-key { color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; font-size: 12px; }
        .detail-val { font-family: var(--font-mono); font-size: 13px; color: var(--text); text-align: right; max-width: 60%; word-break: break-word; cursor: pointer; padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; }
        .detail-val:hover { border-color: var(--border); background: var(--surface2); }
        input.detail-editing { font-family: var(--font-mono); font-size: 13px; color: var(--text); background: var(--surface2); border: 1px solid var(--t1); border-radius: 6px; padding: 4px 8px; text-align: right; outline: none; width: 60%; }

        .card-actions { display: flex; gap: 8px; padding: 12px 14px; background: var(--surface2); }
        .btn-copy { flex: 1; padding: 12px; border-radius: 10px; border: none; font-family: var(--font-main); font-size: 16px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.15s; -webkit-appearance: none; }
        .btn-copy:active { opacity: 0.7; }
        .btn-outline { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-primary-t1 { background: var(--t1); color: #fff; border: none; }
        .btn-primary-t2 { background: var(--t2); color: #0f0f0f; border: none; }
        .btn-primary-mit { background: var(--mit); color: #fff; border: none; }

        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #fff; color: #000; padding: 10px 20px; border-radius: 100px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 100; white-space: nowrap; pointer-events: none; max-width: 90vw; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ef4444; color: #fff; }
        .toast.success { background: #22c55e; color: #fff; }

        .no-results { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; font-weight: 700; }
        .loading-screen { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; font-weight: 700; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; overflow-y: auto; padding: 20px 12px 40px; }
        .modal-overlay.open { display: block; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; max-width: 500px; margin: 0 auto; overflow: hidden; }
        .modal-header { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
        .modal-title span { font-size: 12px; font-family: var(--font-mono); color: var(--muted); display: block; font-weight: 400; text-transform: none; letter-spacing: 1px; margin-top: 2px; }
        .modal-close { background: var(--surface2); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

        .profile-canvas-wrap { background: var(--bg); padding: 16px; display: flex; justify-content: center; border-bottom: 1px solid var(--border); }
        canvas#profile-canvas { display: block; }

        .seg-table-wrap { padding: 12px 14px; }
        .seg-header { display: grid; grid-template-columns: 1fr 1fr 1fr 80px 36px; gap: 5px; margin-bottom: 6px; }
        .seg-header span { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: center; }
        .seg-row { display: grid; grid-template-columns: 1fr 1fr 1fr 80px 36px; gap: 5px; margin-bottom: 6px; align-items: center; }
        .seg-raggio-wrap { display: flex; flex-direction: column; gap: 3px; }
        .seg-pos-btns { display: flex; gap: 3px; }
        .seg-pos { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: #555; height: 22px; border-radius: 5px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .seg-pos-on { background: #1a3a5a; border-color: var(--t1); color: var(--t1); }
        .seg-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 14px; padding: 8px 6px; border-radius: 8px; text-align: center; outline: none; width: 100%; -webkit-appearance: none; }
        .seg-input:focus { border-color: var(--t1); }
        .seg-del { background: #ef444420; border: 1px solid #ef444440; color: #ef4444; width: 32px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .seg-del:active { opacity: 0.7; }
        .btn-add-seg { width: 100%; padding: 11px; background: var(--surface2); border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font-family: var(--font-main); font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-add-seg:active { opacity: 0.7; }
        .btn-save-profile { width: 100%; padding: 14px; background: var(--t1); border: none; border-radius: 12px; color: #fff; font-family: var(--font-main); font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 12px; letter-spacing: 0.5px; }
        .btn-save-profile:active { opacity: 0.8; }
        .btn-profilo { width: 100%; padding: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--font-main); font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 8px; }
        .btn-delete { border-color: #7f1d1d; color: #f87171; background: #1a0a0a; }
        .seg-tag { background: #2a2a2a; border: 1px solid #444; color: #666; width: 32px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
        .seg-tag:active { opacity: 0.7; }
        .seg-tag-on { background: #7a5a0050; border-color: #fbbf24; color: #fbbf24; }
        .seg-tagliente { border-color: #fbbf24 !important; color: #fde68a !important; background: #3a2a0a !important; }
        .seg-input-r { font-size: 12px; opacity: 0.85; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo">TOOLBOX CNC<span>ARCHIVIO UTENSILI</span></div>
        <div class="header-right">
            <div class="count-badge" id="count-badge">...</div>
            <div class="header-right-btns">
                <button class="sync-btn" id="sync-btn" onclick="loadFromFirebase()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Sync
                </button>
                <button class="sync-btn add-btn" onclick="addNewTool()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nuovo
                </button>
                <button class="sync-btn" id="email-toggle-btn" onclick="toggleEmailNotify()" title="Notifiche email">
                    📧 <span id="email-toggle-label">ON</span>
                </button>
            </div>
        </div>
    </div>
    <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="search" placeholder="Cerca numero, nome, diametro..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="tabs">
        <button class="tab active-t1" data-tab="toshiba1">Toshiba 1</button>
        <button class="tab" data-tab="toshiba2" style="color:var(--muted)">Toshiba 2</button>
        <button class="tab" data-tab="mitsubishi" style="color:var(--muted)">Mitsubishi</button>
    </div>
</header>

<main id="main"><div class="loading-screen">⏳ Caricamento dati...</div></main>
<div class="toast" id="toast"></div>
<input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">
<input type="file" id="photo-inserto-input" accept="image/*" capture="environment" style="display:none">
<div id="lightbox" onclick="closeLightbox()">
    <button id="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
</div>

<div class="modal-overlay" id="profile-modal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Profilo Utensile<span id="profile-modal-subtitle"></span></div>
            <button class="modal-close" onclick="closeProfileModal()">✕</button>
        </div>
        <div class="profile-canvas-wrap">
            <canvas id="profile-canvas" width="280" height="260"></canvas>
        </div>
        <div class="seg-table-wrap">
            <div class="seg-header">
                <span>Sopra (mm)</span>
                <span>Altezza (mm)</span>
                <span>Sotto (mm)</span>
                <span>Raggio</span>
                <span></span>
            </div>
            <div id="seg-rows"></div>
            <button class="btn-add-seg" onclick="addSegRow()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Aggiungi segmento
            </button>
            <button class="btn-save-profile" onclick="saveProfile()">💾 Salva profilo</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        emailjs.init({ publicKey: 'ANShSSPasn5Y6D0Fu' });
    });
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyATV2hCksMBnkrn4LEQrJKepSlN5_kRQ_M",
    authDomain: "toolbox-cnc-4b720.firebaseapp.com",
    projectId: "toolbox-cnc-4b720",
    storageBucket: "toolbox-cnc-4b720.firebasestorage.app",
    messagingSenderId: "532626836671",
    appId: "1:532626836671:web:606c79a3316f9074feca0a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let DB = { toshiba1: [], toshiba2: [], mitsubishi: [] };
let activeTab = 'toshiba1';
let searchQuery = '';
let expandedIdx = null;
let currentPhotoRealIdx = null;
let currentInsertoRealIdx = null;
let savingInProgress = false;

async function loadFromFirebase() {
    setSyncState(true);
    while(savingInProgress) {
        await new Promise(resolve => setTimeout(resolve, 100));
    }
    await new Promise(resolve => setTimeout(resolve, 2000)); // AGGIUNGI QUESTA RIGA
    
    try {
        const tabs = ['toshiba1', 'toshiba2', 'mitsubishi'];
        let loaded = false;
        for (const tab of tabs) {
            const docRef = doc(db, 'toolbox', tab);
            const snap = await getDoc(docRef);
            if (snap.exists() && snap.data().rows && snap.data().rows.length > 0) {
                DB[tab] = snap.data().rows;
                loaded = true;
            } else {
                DB[tab] = JSON.parse(JSON.stringify(FALLBACK_DATA[tab]));
            }
        }
        render();
        showToast(loaded ? '✓ Dati aggiornati' : '✓ Dati inizializzati', 'success');
    } catch(e) {
        console.error(e);
        DB = JSON.parse(JSON.stringify(FALLBACK_DATA));
        render();
        showToast('Offline — dati locali', 'error');
    }
    setSyncState(false);
}





    
async function saveTabToFirebase(tabName) {
    savingInProgress = true;
    try {
        const docRef = doc(db, 'toolbox', tabName);
        await setDoc(docRef, { rows: DB[tabName] });
        await new Promise(resolve => setTimeout(resolve, 2000));
    } catch(e) {
        console.error('Errore salvataggio:', e);
        showToast('Errore salvataggio', 'error');
    } finally {
        savingInProgress = false;
    }
}

window.addNewTool = async function() {
    const existing = DB[activeTab].map(t => parseInt(t['N° Utensile']) || 0);
    const nextNum = existing.length > 0 ? Math.max(...existing) + 1 : 1;
    const newTool = {
        'N° Utensile': String(nextNum),
        'Nome Assembly': 'NUOVO UTENSILE',
        'Nome Utensile': '',
        'Descrizione': '',
        'Codice Catalogo': '',
        'Codice Viti': '',
        'Produttore': '',
        'Tipo Utensile': '',
        'Diametro (mm)': '0',
        'Lunghezza Totale (mm)': '0',
        'Prof. Taglio (mm)': '0',
        'N° Taglienti': '0',
        'Raggio Angolo (mm)': '0',
        'Diam. Punta (mm)': '0',
        'Angolo Conicità (°)': '0',
        'Angolo Punta (°)': '0',
        'Codice Produttore': '',
        'Giri (rpm)': '0',
        'Avanzamento (mm/min)': '0',
        'Affondamento (mm/min)': '0',
    };
    DB[activeTab].unshift(newTool);
    expandedIdx = 0;
    searchQuery = '';
    document.getElementById('search').value = '';
    render();
    showToast('✓ Nuovo utensile aggiunto', 'success');
    const tab = activeTab === 'toshiba1' ? 'Toshiba 1' : activeTab === 'toshiba2' ? 'Toshiba 2' : 'Mitsubishi';
    sendEmail(tab, String(nextNum), 'NUOVO UTENSILE', 'Aggiunto nuovo utensile', `T${nextNum} aggiunto al database`);
    await saveTabToFirebase(activeTab);
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
};

window.deleteTool = async function(realIdx) {
    const tool = DB[activeTab][realIdx];
    const nome = tool['Nome Assembly'] || tool['Nome Utensile'] || '';
    const num = tool['N° Utensile'] || '';
    const tab = activeTab === 'toshiba1' ? 'Toshiba 1' : activeTab === 'toshiba2' ? 'Toshiba 2' : 'Mitsubishi';
    if (!confirm(`Eliminare T${num} - ${nome}?`)) return;
    DB[activeTab].splice(realIdx, 1);
    expandedIdx = null;
    render();
    showToast('🗑 Utensile eliminato', 'error');

function resizeImage(file, maxSize) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
                else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

}

window.startEdit = function(event, realIdx, fieldName) {
    event.stopPropagation();
    const span = event.target;
    const currentVal = span.textContent === '-' ? '' : span.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = currentVal;
    input.className = 'detail-editing';
    input.onclick = e => e.stopPropagation();

    const save = async () => {
        const newVal = input.value.trim();
        if (newVal === currentVal) { input.replaceWith(span); return; }
        const oldVal = DB[activeTab][realIdx][fieldName];
        DB[activeTab][realIdx][fieldName] = newVal;
        span.textContent = newVal || '-';
        input.replaceWith(span);
        showToast('💾 Salvataggio...');
        await saveTabToFirebase(activeTab);
        showToast('✓ Salvato', 'success');
        const _t = DB[activeTab][realIdx];
        const _tab = activeTab === 'toshiba1' ? 'Toshiba 1' : activeTab === 'toshiba2' ? 'Toshiba 2' : 'Mitsubishi';
        sendEmail(_tab, _t['N° Utensile'] || '', _t['Nome Assembly'] || _t['Nome Utensile'] || '', 'Modifica campo', `${fieldName}: ${oldVal || '-'} → ${newVal}`);
    };

    input.onblur = save;
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') input.replaceWith(span); };
    span.replaceWith(input);
    input.focus();
    input.select();
};

    } else {

    }
    renderSegRows();
    drawProfile();

function drawProfile() {
    const canvas = document.getElementById('profile-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const segs = profileSegments.filter(s => s.altezza > 0);
    if (segs.length === 0) return;
    const totalH = segs.reduce((s, r) => s + r.altezza, 0);
    const maxD = Math.max(...segs.map(s => Math.max(s.sopra, s.sotto)), 1);
    const padTop = 28, padBot = 36, padLeft = 52, padRight = 50;
    const drawW = W - padLeft - padRight;
    const drawH = H - padTop - padBot;
    const scaleByH = drawH / totalH;
    const scaleByW = drawW / maxD;
    const scale = Math.min(scaleByH, scaleByW);
    const scaleH = scale;
    const scaleW = scale;
    const cx = padLeft + drawW / 2;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cx, padTop - 8); ctx.lineTo(cx, H - padBot + 8); ctx.stroke();
    ctx.setLineDash([]);
    let y = padTop;
    for (let i = 0; i < segs.length; i++) {
        const seg = segs[i];
        const r1 = (seg.sopra / 2) * scaleW;
        const r2 = (seg.sotto / 2) * scaleW;
        const h = seg.altezza * scaleH;
        const raggio = Math.min(seg.raggio || 0, seg.altezza / 2, Math.min(seg.sopra, seg.sotto) / 2);
        const rs = raggio * Math.min(scaleW, scaleH);
        const pos = seg.raggioPos || 'sotto';
        const rSopra = (pos === 'sopra' || pos === 'entrambi') && rs > 1;
        const rSotto = (pos === 'sotto' || pos === 'entrambi') && rs > 1;
        ctx.beginPath();
        if (rSopra) {
            ctx.moveTo(cx + r1 - rs, y);
            ctx.arcTo(cx + r1, y, cx + r1, y + rs, rs);
        } else {
            ctx.moveTo(cx + r1, y);
        }
        if (rSotto) {
            ctx.lineTo(cx + r2, y + h - rs);
            ctx.arcTo(cx + r2, y + h, cx + r2 - rs, y + h, rs);
        } else {
            ctx.lineTo(cx + r2, y + h);
        }
        if (rSotto) {
            ctx.lineTo(cx - r2 + rs, y + h);
            ctx.arcTo(cx - r2, y + h, cx - r2, y + h - rs, rs);
        } else {
            ctx.lineTo(cx - r2, y + h);
        }
        if (rSopra) {
            ctx.lineTo(cx - r1, y + rs);
            ctx.arcTo(cx - r1, y, cx - r1 + rs, y, rs);
        } else {
            ctx.lineTo(cx - r1, y);
        }
        ctx.closePath();
        if (seg.tagliente) {
            const grad = ctx.createLinearGradient(cx - r1, 0, cx + r1, 0);
            grad.addColorStop(0, '#7a5a00'); grad.addColorStop(0.35, '#f59e0b');
            grad.addColorStop(0.5, '#fde68a'); grad.addColorStop(0.65, '#f59e0b'); grad.addColorStop(1, '#7a5a00');
            ctx.fillStyle = grad; ctx.fill();
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.stroke();
        } else {
            const grad = ctx.createLinearGradient(cx - r1, 0, cx + r1, 0);
            grad.addColorStop(0, '#2a4a7a'); grad.addColorStop(0.35, '#4f8ef7');
            grad.addColorStop(0.5, '#7ab4ff'); grad.addColorStop(0.65, '#4f8ef7'); grad.addColorStop(1, '#2a4a7a');
            ctx.fillStyle = grad; ctx.fill();
            ctx.strokeStyle = '#4f8ef7'; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.fillStyle = '#ddd';
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText(seg.altezza.toFixed(1), padLeft - 6, y + h / 2 + 4);
        if (i < segs.length - 1) {
            ctx.strokeStyle = '#444'; ctx.lineWidth = 0.5; ctx.setLineDash([2, 4]);
            ctx.beginPath(); ctx.moveTo(padLeft, y + h); ctx.lineTo(W - padRight - 18, y + h); ctx.stroke();
            ctx.setLineDash([]);
        }
        y += h;
    }
    ctx.fillStyle = '#ddd'; ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
    const firstR = (segs[0].sopra / 2) * scaleW;
    ctx.fillText('Ø' + segs[0].sopra.toFixed(1), cx + firstR / 2 + 14, padTop - 8);
    const lastSeg = segs[segs.length - 1];
    const lastR = (lastSeg.sotto / 2) * scaleW;
    ctx.fillText('Ø' + lastSeg.sotto.toFixed(1), cx + lastR / 2 + 14, H - padBot + 16);
    const yTop = padTop;
    const yBot = padTop + totalH * scaleH;
    const xQ = cx + (maxD / 2) * scaleW + 12;
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(xQ - 4, yTop); ctx.lineTo(xQ + 4, yTop);
    ctx.moveTo(xQ, yTop); ctx.lineTo(xQ, yBot);
    ctx.moveTo(xQ - 4, yBot); ctx.lineTo(xQ + 4, yBot);
    ctx.stroke();
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.translate(xQ + 16, (yTop + yBot) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('TOT ' + totalH.toFixed(1) + ' mm', 0, 0);
    ctx.restore();
}

    DB[activeTab][profileRealIdx]['Profilo'] = JSON.parse(JSON.stringify(profileSegments));

    showToast('✓ Profilo salvato', 'success');
    closeProfileModal();
    render();
};
